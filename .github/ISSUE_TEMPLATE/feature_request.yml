name: Feature request
description: Propose an improvement to EZdeploy
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what are they trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe observable behavior, not only implementation details.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security considerations
